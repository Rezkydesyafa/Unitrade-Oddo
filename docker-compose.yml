version: '3.8'
services:
  web:
    image: odoo:17.0 # Pembaruan mutlak ke Odoo 17
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./:/mnt/extra-addons
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    
  mailpit:
    image: axllent/mailpit
    container_name: unitrade_mail
    ports:
      - "8025:8025" # Port untuk melihat email di browser
      - "1025:1025" # Port SMTP untuk komunikasi dengan Odoo
  
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

  # JALUR 2: Panel pgAdmin berbasis Web (Tinggal buka via browser VPS)
  pgadmin:
    image: dpage/pgadmin4
    container_name: unitrade_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@unitrade.web.id   # Email untuk login ke web pgAdmin
      PGADMIN_DEFAULT_PASSWORD: masbahlilganteng    # Password untuk login ke web pgAdmin
    ports:
      - "8050:80" # Akses pgAdmin via browser di port 8050
    depends_on:
      - db

  # Mesin pekerja sementara untuk merender Tailwind CSS
  frontend-builder:
    image: node:lts
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npm run build"

volumes:
  odoo-web-data:
  odoo-db-data: