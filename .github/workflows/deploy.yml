name: Deploy VPS

on:
  push:
    branches:
      - main
      - devops/ci-cd

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: baristasigma/unitrade-app:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          set -e

          cd /root/unitrade

          docker compose pull

          docker compose up -d db

          docker compose stop web || true

          trap 'docker compose up -d --force-recreate web' EXIT

          docker compose run --rm web odoo -d unitrade_db -u unitrade_theme,unitrade_notification,unitrade_admin,unitrade_seller,unitrade_dispute,unitrade_payment,unitrade_review,unitrade_product_ext --stop-after-init

          docker compose run --rm web odoo shell -d unitrade_db --no-http <<'PY'
          attachments = env['ir.attachment'].sudo().search([('url', 'like', '/web/assets/')])
          count = len(attachments)
          attachments.unlink()
          env.cr.commit()
          print('Cleared %s Odoo web asset attachment(s).' % count)
          PY

          docker compose up -d --force-recreate web

          trap - EXIT

          docker compose ps
