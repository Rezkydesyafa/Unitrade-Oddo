name: Deploy VPS

on:
  push:
    branches:
      - main
      - devops/ci-cd

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: baristasigma/unitrade-app:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          set -e

          cd /root/unitrade

          if [ -d .git ]; then
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
          fi

          docker compose pull

          docker compose run --rm --no-deps web sh -lc "
            grep -q 'body.ut-has-seller-dashboard-page' /mnt/extra-addons/unitrade_seller/static/src/css/seller_dashboard.css &&
            ! grep -q 'body:has(.ut-seller-dashboard-page)' /mnt/extra-addons/unitrade_seller/static/src/css/seller_dashboard.css &&
            grep -q 'ut-has-seller-dashboard-page' /mnt/extra-addons/unitrade_seller/static/src/js/seller_dashboard.js
          "
          
          docker compose up -d db
          docker compose up -d db mailpit

          

          docker compose stop web || true
          docker compose rm -f web || true

          trap 'docker compose pull web && docker compose up -d --no-deps --force-recreate web' EXIT

          docker compose run --rm web odoo -d unitrade_db -u unitrade_theme,unitrade_notification,unitrade_admin,unitrade_seller,unitrade_dispute,unitrade_payment,unitrade_review,unitrade_cs_ai,unitrade_product_ext --stop-after-init

          docker compose run --rm web odoo shell -d unitrade_db --no-http <<'PY'
          attachments = env['ir.attachment'].sudo().search([('url', 'like', '/web/assets/')])
          count = len(attachments)
          attachments.unlink()
          env.cr.commit()
          print('Cleared %s Odoo web asset attachment(s).' % count)
          PY

          docker compose pull web
          docker compose up -d --no-deps --force-recreate web

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8069/web/login >/dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS "http://127.0.0.1:8069/unitrade_seller/static/src/css/seller_dashboard.css?sha=${{ github.sha }}" > /tmp/unitrade_seller_dashboard.css
          grep -q 'body.ut-has-seller-dashboard-page' /tmp/unitrade_seller_dashboard.css
          ! grep -q 'body:has(.ut-seller-dashboard-page)' /tmp/unitrade_seller_dashboard.css

          trap - EXIT

          docker compose ps

    - name: Verify public production asset
      run: |
        curl -fsS "https://unitrade.web.id/unitrade_seller/static/src/css/seller_dashboard.css?sha=${GITHUB_SHA}" > /tmp/unitrade_public_seller_dashboard.css
        grep -q 'body.ut-has-seller-dashboard-page' /tmp/unitrade_public_seller_dashboard.css
        ! grep -q 'body:has(.ut-seller-dashboard-page)' /tmp/unitrade_public_seller_dashboard.css
